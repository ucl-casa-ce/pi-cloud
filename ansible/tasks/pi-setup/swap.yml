---
- name: Configure Swap (zram in-memory compressed swap to protect SD cards).
  hosts: picloud
  gather_facts: true
  become: true

  tasks:
    - name: Disable dphys-swapfile swap to protect SD card from wear
      ansible.builtin.command: dphys-swapfile swapoff
      failed_when: false
      changed_when: false

    - name: Disable and stop dphys-swapfile service
      ansible.builtin.systemd:
        name: dphys-swapfile
        state: stopped
        enabled: false
      failed_when: false

    - name: Install zram-tools
      ansible.builtin.apt:
        name: zram-tools
        state: present

    - name: Configure zram swap (50% RAM, zstd compression)
      ansible.builtin.lineinfile:
        path: /etc/default/zramswap
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
      loop:
        - { regexp: '^#?ALGO=', line: 'ALGO=zstd' }
        - { regexp: '^#?PERCENT=', line: 'PERCENT=50' }

    - name: Ensure zramswap service is enabled and started
      ansible.builtin.systemd:
        name: zramswap
        state: started
        enabled: true
