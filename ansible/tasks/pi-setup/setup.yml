---
- name: Set up PiCloud Default Settings.
  hosts: picloud
  gather_facts: true
  become: true

  vars_files:
    - ../../vars/picloud.yml

  # vars:
  #   timezone: "Europe/London"
  #   locale: "en_GB.UTF-8"
  #   admin_password: ""

  handlers:
    - name: Restart systemd-journald
      become: true
      ansible.builtin.service:
        name: systemd-journald
        state: restarted

  tasks:
    - name: Update apt-get repo and cache
      become: true
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Upgrade all apt packages
      become: true
      ansible.builtin.apt:
        upgrade: dist

    - name: Install packages
      become: true
      ansible.builtin.apt:
        pkg:
          - git
          - ca-certificates
          - curl
          - byobu
          - nano
          - screen
          - ufw
          - podman
          - podman-compose
          - btop

    - name: Install wtmpdb session history tools (Debian 13 / Trixie)
      become: true
      ansible.builtin.apt:
        pkg:
          - wtmpdb
          - libpam-wtmpdb
      when: ansible_distribution_major_version | int >= 13
      ignore_errors: true

    # - name: Enable Byobu at Login (as user pi)
    #   become: true
    #   ansible.builtin.shell: "byobu-enable"

    - name: Rename hostname
      shell: 'echo {{ inventory_hostname }} > /etc/hostname'
      args:
        creates: /etc/hostname

    - name: Rename Hostname in Config
      ansible.builtin.shell: "raspi-config nonint do_hostname {{ inventory_hostname }}"

    - name: Set Locale
      ansible.builtin.shell: "raspi-config nonint do_change_locale {{ locale }}"

    - name: Set Timezone
      ansible.builtin.shell: "raspi-config nonint do_change_timezone {{ timezone }}"

    - name: Set Wifi Country
      ansible.builtin.shell: "raspi-config nonint do_wifi_country {{ wifi_country }}"

    # - name: Setup wifi
    #   copy:
    #     src: wpa_supplicant.conf
    #     dest: /etc/wpa_supplicant/wpa_supplicant.conf

    - name: Enable I2C
      ansible.builtin.shell: "raspi-config nonint do_i2c 0"

    - name: Enable SPI
      ansible.builtin.shell: "raspi-config nonint do_spi 0"

    - name: Enable Camera (Legacy camera stack, Bookworm and earlier)
      ansible.builtin.shell: "raspi-config nonint do_camera 0"
      failed_when: false
      when: ansible_distribution_major_version | int <= 12

    - name: Enable VNC
      ansible.builtin.shell: "raspi-config nonint do_vnc 0"

    - name: Ensure .config directory exists for pi user
      ansible.builtin.file:
        path: /home/pi/.config
        state: directory
        owner: pi
        group: pi
        mode: '0755'

    - name: Add and create resolution file for VNC Server (Wayfire / Bookworm)
      ansible.builtin.blockinfile:
        path: /home/pi/.config/wayfire.ini
        create: true
        owner: pi
        group: pi
        mode: '0644'
        block: |
          [output:NOOP-1]
          mode = {{ screen_width }}x{{ screen_height }}
          position = 0,0
          transform = normal

    - name: Ensure kanshi directory exists for pi user
      ansible.builtin.file:
        path: /home/pi/.config/kanshi
        state: directory
        owner: pi
        group: pi
        mode: '0755'

    - name: Add and create resolution file for VNC Server (labwc / Trixie)
      ansible.builtin.blockinfile:
        path: /home/pi/.config/kanshi/config
        create: true
        owner: pi
        group: pi
        mode: '0644'
        block: |
          profile {
              output HDMI-A-1 mode {{ screen_width }}x{{ screen_height }}@60.000Hz position 0,0
          }
          profile {
              output HEADLESS-1 mode {{ screen_width }}x{{ screen_height }}@60.000Hz position 0,0
          }

    - name: Enable OneWire
      ansible.builtin.shell: "raspi-config nonint do_onewire 0"

    - name: Enable Remote GPIO (Debian 12 / Bookworm and earlier)
      ansible.builtin.shell: "raspi-config nonint do_rgpio 0"
      failed_when: false
      when: ansible_distribution_major_version | int <= 12

    - name: Remove uncoordinated 5am cron upgrade (managed via upgrade.yml)
      become: true
      ansible.builtin.cron:
        name: "Update and upgrade"
        state: absent

    - name: Configure journald storage to volatile to reduce SD card wear
      become: true
      ansible.builtin.lineinfile:
        path: /etc/systemd/journald.conf
        regexp: '^#?Storage='
        line: 'Storage=volatile'
      notify: Restart systemd-journald

    - name: Cap journald runtime memory usage to 50M
      become: true
      ansible.builtin.lineinfile:
        path: /etc/systemd/journald.conf
        regexp: '^#?RuntimeMaxUse='
        line: 'RuntimeMaxUse=50M'
      notify: Restart systemd-journald

    - name: Removing Raspberry Pi OS Default Folder Structure
      file:
        path: "{{ item }}"
        state: absent
      with_items:
        - /home/pi/Bookshelf
        - /home/pi/Documents
        - /home/pi/Desktop
        - /home/pi/Downloads
        - /home/pi/Pictures
        - /home/pi/Public
        - /home/pi/Templates
        - /home/pi/Videos
        - /home/pi/Music

    - name: Add 2 Screen Resolution Lines to /boot/firmware/config.txt
      ansible.builtin.lineinfile:
        path: /boot/firmware/config.txt
        line: "framebuffer_width={{ screen_width }}"
        insertafter: EOF

    - name: Add 2 Screen Resolution Lines to /boot/firmware/config.txt
      ansible.builtin.lineinfile:
        path: /boot/firmware/config.txt
        line: "framebuffer_height={{ screen_height }}"
        insertafter: EOF

    - name: Remove misplaced cgroup line from /boot/firmware/config.txt
      ansible.builtin.lineinfile:
        path: /boot/firmware/config.txt
        line: "cgroup_enable=memory cgroup_memory=1"
        state: absent

    - name: Add MicroK8s cgroup parameters to /boot/firmware/cmdline.txt
      ansible.builtin.replace:
        path: /boot/firmware/cmdline.txt
        regexp: '^((?!.*cgroup_enable=memory).*)'
        replace: '\1 cgroup_enable=memory cgroup_memory=1'

    - name: Remove any misplaced PoE fan parameters from /boot/firmware/cmdline.txt
      ansible.builtin.replace:
        path: /boot/firmware/cmdline.txt
        regexp: '\s*(poe_fan_\w+=\S+|dtoverlay=rpi-poe\S*|rpi-poe\S*)'
        replace: ''

    - name: Configure Raspberry Pi PoE HAT fan overlay in /boot/firmware/config.txt
      ansible.builtin.lineinfile:
        path: /boot/firmware/config.txt
        regexp: '^dtoverlay=rpi-poe'
        line: "dtoverlay={{ poe_fan_overlay }},poe_fan_temp0={{ poe_fan_temp0 }},poe_fan_temp0_hyst={{ poe_fan_temp0_hyst }},poe_fan_temp1={{ poe_fan_temp1 }},poe_fan_temp1_hyst={{ poe_fan_temp1_hyst }},poe_fan_temp2={{ poe_fan_temp2 }},poe_fan_temp2_hyst={{ poe_fan_temp2_hyst }},poe_fan_temp3={{ poe_fan_temp3 }},poe_fan_temp3_hyst={{ poe_fan_temp3_hyst }}"
        insertafter: EOF
        state: present

    - name: Ensure udev rules for PoE fan sysfs permissions
      become: true
      ansible.builtin.copy:
        dest: /etc/udev/rules.d/99-poe-fan.rules
        owner: root
        group: root
        mode: '0644'
        content: |
          # Allow picloud services and users to control PoE HAT fan cooling devices
          SUBSYSTEM=="thermal", KERNEL=="cooling_device*", ACTION=="add", RUN+="/bin/chmod 0666 /sys/class/thermal/%k/cur_state"
          SUBSYSTEM=="thermal", KERNEL=="thermal_zone*", ACTION=="add", RUN+="/bin/sh -c 'chmod 0666 /sys/class/thermal/%k/trip_point_* 2>/dev/null || true'"
          SUBSYSTEM=="hwmon", KERNEL=="hwmon*", ACTION=="add", RUN+="/bin/sh -c 'chmod 0666 /sys/class/hwmon/%k/pwm1* 2>/dev/null || true'"


    - name: Create new admin user
      become: true
      user:
        name: "{{ admin_user }}"
        password: "{{ admin_password | password_hash('sha512') }}"
        shell: /bin/bash
        groups: sudo
        append: true

    - name: Add admin user to sudoers file
      become: true
      lineinfile:
        path: /etc/sudoers
        line: "{{ admin_user }} ALL=(ALL) NOPASSWD:ALL"
        validate: "visudo -cf %s"
        state: present

    - name: Ensure kanshi config directory exists for admin_user
      ansible.builtin.file:
        path: /home/{{ admin_user }}/.config/kanshi
        state: directory
        owner: "{{ admin_user }}"
        group: "{{ admin_user }}"
        mode: '0755'

    - name: Add resolution file for VNC Server for admin_user (labwc)
      ansible.builtin.blockinfile:
        path: /home/{{ admin_user }}/.config/kanshi/config
        create: true
        owner: "{{ admin_user }}"
        group: "{{ admin_user }}"
        mode: '0644'
        block: |
          profile {
              output HDMI-A-1 mode {{ screen_width }}x{{ screen_height }}@60.000Hz position 0,0
          }
          profile {
              output HEADLESS-1 mode {{ screen_width }}x{{ screen_height }}@60.000Hz position 0,0
          }

    - name: Ensure Fastfetch config directory exists for admin_user
      ansible.builtin.file:
        path: /home/{{ admin_user }}/.config/fastfetch
        state: directory
        owner: "{{ admin_user }}"
        group: "{{ admin_user }}"
        mode: '0755'

    - name: Configure Fastfetch with CPU Temp and Local IP for admin_user
      ansible.builtin.copy:
        dest: /home/{{ admin_user }}/.config/fastfetch/config.jsonc
        owner: "{{ admin_user }}"
        group: "{{ admin_user }}"
        mode: '0644'
        content: |
          {
            "$schema": "https://github.com/fastfetch-cli/fastfetch/raw/dev/doc/json_schema.json",
            "modules": [
              "title",
              "separator",
              "os",
              "host",
              "kernel",
              "uptime",
              "packages",
              "shell",
              {
                "type": "cpu",
                "temp": true
              },
              "memory",
              "swap",
              "disk",
              {
                "type": "localip",
                "key": "IP Address",
                "showLoopback": false,
                "showIpv6": false,
                "showPrefixLen": false
              }
            ]
          }

    - name: Remove broken myip line from .bashrc
      ansible.builtin.lineinfile:
        path: /home/{{ admin_user }}/.bashrc
        regexp: '^myip=.*addr:'
        state: absent

    - name: Add Fastfetch/Neofetch, temperature and IP to .bashrc
      ansible.builtin.blockinfile:
        path: /home/{{ admin_user }}/.bashrc
        block: |
          if command -v fastfetch >/dev/null 2>&1; then
            fastfetch
          elif command -v neofetch >/dev/null 2>&1; then
            neofetch
            vcgencmd measure_temp
            myip=$(ifconfig eth0 2>/dev/null | sed -En 's/127.0.0.1//;s/.*inet (addr:)?(([0-9]*\.){3}[0-9]*).*/\2/p')
            echo "IP Address : $myip"
          fi
